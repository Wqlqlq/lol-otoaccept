name: Build Windows exe and release

# Builds LoLAutoAccept.exe on Windows, checks that it starts, and publishes it
# as a GitHub release. Runs when VERSION changes (release "v<VERSION>", the tag
# is created automatically), when the release notes change (the current
# release is refreshed), or when a tag such as v1.0.0 is pushed.
on:
  push:
    branches: ["**"]
    paths: ["VERSION", ".github/release-notes.md"]  # path filters do not apply to tag pushes
    tags: ["v*"]

permissions:
  contents: write

# Two runs for the same release must not race to create it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v" + (Get-Content VERSION -Raw).Trim()
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag '$tag'. Use a version like 1.0.0." }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release tag: $tag"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build exe
        shell: cmd
        run: build_exe.bat

      - name: Smoke test (exe opens its main window and writes logs next to itself)
        shell: pwsh
        run: |
          $work = New-Item -ItemType Directory -Force -Path smoke-test
          Copy-Item dist\LoLAutoAccept.exe $work
          Start-Process -FilePath "$work\LoLAutoAccept.exe" -WorkingDirectory $work | Out-Null

          $windowFound = $false
          $deadline = (Get-Date).AddSeconds(90)
          while (-not $windowFound -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            $titles = @(Get-Process -Name LoLAutoAccept -ErrorAction SilentlyContinue |
              ForEach-Object { $_.MainWindowTitle })
            $windowFound = $titles -contains "LoL Auto Accept"
          }
          Write-Host "Window titles: $($titles -join ', ')"
          Get-Process -Name LoLAutoAccept -ErrorAction SilentlyContinue | Stop-Process -Force

          $log = "$work\logs.txt"
          if (Test-Path $log) { Get-Content $log }
          if (-not $windowFound) { throw "The main window did not appear." }
          if (-not (Select-String -Path $log -Pattern "Application started" -Quiet)) {
            throw "logs.txt was not written next to the exe."
          }
          if (Select-String -Path $log -Pattern "error" -Quiet) { throw "The app logged an error." }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist\LoLAutoAccept.exe -Algorithm SHA256).Hash
          $notes = (Get-Content .github\release-notes.md -Raw) + "`n`nSHA256 (LoLAutoAccept.exe): ``$hash``"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist\LoLAutoAccept.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading the exe failed." }
            gh release edit $env:TAG --notes-file release-notes.md
          } else {
            gh release create $env:TAG dist\LoLAutoAccept.exe --target $env:GITHUB_SHA `
              --title "LoL Auto Accept $env:TAG" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }
